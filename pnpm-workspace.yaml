packages:
  - "apps/*"
  - "libs/*"
  - "tools/*"

allowBuilds:
  bun: true
  esbuild: true
  sharp: true
  workerd: true

# Hoist type packages to the root node_modules so tsc can name inferred
# types by bare specifier during declaration checks (avoids TS2742 under
# pnpm's isolated store).
publicHoistPattern:
  - "*types*"

catalog:
  astro: ^7.2.4
  "@astrojs/sitemap": ^3.7.0
  "@astrojs/check": ^0.9.10
  sharp: ^0.35.3
  zod: ^4.4.3
  typescript: ^5.9.2
  vite-plus: ^0.1.21
  wrangler: ^4.0.0
